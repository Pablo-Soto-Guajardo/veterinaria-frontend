server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/veterinaria-san-marcos;
    index index.html;

    # /api/auth-service/v1/auth/login  ->  127.0.0.1:8081/api/v1/auth/login
    location /api/auth-service/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/store-service/v1/productos  ->  127.0.0.1:8082/api/v1/productos
    location /api/store-service/ {
        proxy_pass http://127.0.0.1:8082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Si la URL no es un archivo real, entrega index.html
        # para que React Router interprete la ruta (/productos/ME005, /admin, ...).
        try_files $uri $uri/ /index.html;
    }
}
